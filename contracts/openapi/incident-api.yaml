openapi: 3.0.3
info:
  title: Telecom Service Assurance API
  version: 0.3.0
  description: Revision 3 contracts. Service KPI trends and incident episodes replace subscriber risk scoring.
    Application endpoints remain implementation tasks; this document is not evidence of a running API.
servers:
- url: http://telecom.test:8080
  description: Canonical browser origin through NGINX; incident-service uses internal port 8082.
security:
- sessionCookie: []
tags:
- name: Authentication
- name: Incidents
- name: Analysts
- name: Services
- name: Simulator
- name: Geography
- name: Operations
paths:
  /api/geography/cities:
    get:
      operationId: listGeographyCities
      summary: List the configured synthetic city inventory and current service state
      tags: [Geography]
      x-implementation-status: proposed
      description: Ten cities with both services. Legacy scopes remain unallocated. No child topology or full history is embedded.
      responses:
        '200':
          description: Bounded current city summaries from pinned catalogue and durable projections.
          content:
            application/json:
              schema:
                type: object
                required: [generatedAt, catalogueVersion, topologyVersion, cities]
                properties:
                  generatedAt: {type: string, format: date-time}
                  catalogueVersion: {type: string}
                  topologyVersion: {type: string}
                  cities:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items: {$ref: '#/components/schemas/GeographyCitySummary'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/geography/cities/{cityId}:
    get:
      operationId: getGeographyCity
      summary: Read one city's configured footprint and service state
      tags: [Geography]
      x-implementation-status: proposed
      parameters:
      - {$ref: '#/components/parameters/GeographyCityId'}
      responses:
        '200':
          description: City detail; unmeasured child nodes have no copied KPI.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GeographyCityDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/geography/cities/{cityId}/topology:
    get:
      operationId: getGeographyTopology
      summary: Page through contained nodes and separate dependency references
      tags: [Geography]
      x-implementation-status: proposed
      parameters:
      - {$ref: '#/components/parameters/GeographyCityId'}
      - name: parentId
        in: query
        schema: {type: string, maxLength: 96}
        description: Omit for city roots; an explicit parent must belong to this city and catalogue version.
      - name: catalogueVersion
        in: query
        schema: {type: string, maxLength: 80}
        description: Omit for active topology; supply a captured archived version when investigating history.
      - {$ref: '#/components/parameters/Page'}
      - name: size
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Versioned topology page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GeographyTopologyPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/geography/cities/{cityId}/kpis:
    get:
      operationId: getGeographyCityKpis
      summary: Page through finalized KPI windows for one city and service
      tags: [Geography]
      x-implementation-status: proposed
      description: UTC half-open [from,to), at most 24 hours per request and 100 points per page; gaps are not filled.
      parameters:
      - {$ref: '#/components/parameters/GeographyCityId'}
      - name: service
        in: query
        required: true
        schema: {type: string, enum: [VOLTE, SMS]}
      - name: from
        in: query
        required: true
        schema: {type: string, format: date-time, pattern: 'Z$'}
      - name: to
        in: query
        required: true
        schema: {type: string, format: date-time, pattern: 'Z$'}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Canonically ordered persisted KPI windows and matching coverage facts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GeographyKpiPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/operations/priority:
    get:
      operationId: listOperationalPriority
      summary: Page through a stable view of persisted technical incidents
      tags: [Operations]
      x-implementation-status: proposed
      description: Fresh ongoing incidents lead. Uncertain and recovered items retain distinct states. Do not compare VoLTE percentage points with SMS milliseconds.
      parameters:
      - name: cityId
        in: query
        schema: {type: string, pattern: '^[A-Z]{3}$'}
      - name: service
        in: query
        schema: {type: string, enum: [VOLTE, SMS]}
      - name: technicalState
        in: query
        schema: {type: string, enum: [ONGOING, UNKNOWN, RECOVERED]}
      - {$ref: '#/components/parameters/Page'}
      - {$ref: '#/components/parameters/Size'}
      responses:
        '200':
          description: Stable priority page with separate technical and analyst states.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GeographyPriorityPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/services/{scopeId}/ml-shadow:
    get:
      operationId: getServiceMlShadow
      summary: Read optional SMS classifier shadow evidence
      tags: [Services]
      description: Analyst/supervisor/admin session required. UTC windowStart interval [from,to), at most 24 hours. Includes healthy windows, classifier-only positives and failures. Order windowStart ASC,evidenceId ASC. Scores are uncalibrated and do not drive incidents.
      parameters:
      - name: scopeId
        in: path
        required: true
        schema: {type: string, pattern: '^[A-Za-z0-9_.:-]{1,96}$'}
      - name: from
        in: query
        required: true
        schema: {type: string, format: date-time, pattern: 'Z$'}
      - name: to
        in: query
        required: true
        schema: {type: string, format: date-time, pattern: 'Z$'}
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Persisted shadow evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MlShadowPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/incidents/{id}/ml-shadow:
    get:
      operationId: getIncidentMlShadow
      summary: Read shadow evidence in an incident's observed SMS interval
      tags: [Incidents]
      description: Analyst/supervisor/admin session required. Correlates SMS scope and windows overlapping [firstObservedAt,lastObservedAt). A non-SMS incident returns an empty page. Does not alter lifecycle, severity or recovery.
      parameters:
      - $ref: '#/components/parameters/IncidentId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Correlated persisted shadow evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MlShadowPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /oauth2/authorization/keycloak:
    get:
      operationId: startKeycloakLogin
      summary: Start browser login
      tags:
      - Authentication
      description: Browser navigation, not a JSON password request. Backend creates the authorization request.
        Client telecom-web; issuer http://telecom.test:8080/auth/realms/telecom. Never accept an arbitrary
        return URL.
      responses:
        '302':
          description: Redirect to Keycloak authorization with state, nonce and PKCE S256.
          headers:
            Location:
              description: Controlled redirect destination.
              schema:
                type: string
                format: uri-reference
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
  /login/oauth2/code/keycloak:
    get:
      operationId: handleKeycloakCallback
      summary: Complete OIDC login
      tags:
      - Authentication
      description: Provider-to-backend callback; not an endpoint Angular calls manually. Validate stored state
        and OIDC identity. Handle provider error callbacks without exposing credentials or tokens. Missing
        code/state on a success callback is invalid.
      responses:
        '302':
          description: After validated code/state/nonce/issuer and PKCE, rotate the session identifier and
            navigate to /dashboard.
          headers:
            Location:
              description: Controlled redirect destination.
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: code
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      - name: error
        in: query
        schema:
          type: string
      security: []
  /api/auth/me:
    get:
      operationId: getCurrentSession
      summary: Get the current analyst session
      tags:
      - Authentication
      description: Map the verified issuer/subject to the local analyst UUID; roles come from the verified
        app_roles claim. Do not return OIDC tokens or session identifiers.
      responses:
        '200':
          description: Validated analyst identity and absolute session expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Get a CSRF token
      tags:
      - Authentication
      description: Public bootstrap route that may establish a pre-login session. Send the token using the
        returned headerName for JSON mutations or parameterName for form logout.
      responses:
        '200':
          description: CSRF token for the browser session; fetch again after login/logout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
  /logout:
    post:
      operationId: logoutSession
      summary: Log out through browser form navigation
      tags:
      - Authentication
      description: Submit a browser form with the returned CSRF parameter; follow redirects as navigation.
        Refresh CSRF after logout. Not a JSON /api/auth/logout endpoint.
      responses:
        '302':
          description: Invalidate local session/cookie, close its SSE streams, and attempt provider RP-initiated
            logout. Final destination is the registered /signed-out URL. Provider outage must not retain the
            local session.
          headers:
            Location:
              description: Controlled redirect destination.
              schema:
                type: string
                format: uri-reference
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required:
              - _csrf
              properties:
                _csrf:
                  type: string
                  minLength: 1
  /api/analysts:
    get:
      operationId: listAnalysts
      summary: List local analysts
      tags:
      - Analysts
      description: Read the local directory only; no direct Keycloak database queries. enabled=true is the
        default selector for assignment controls. Target eligibility is rechecked at mutation time.
      responses:
        '200':
          description: Public analyst projections; excludes issuer/subject, credentials and tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalystSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: enabled
        in: query
        schema:
          type: boolean
          default: true
  /api/incidents:
    get:
      operationId: listIncidents
      summary: List incident episodes
      tags:
      - Incidents
      description: Sort detectedAt DESC,id DESC. One row per episode, not per breached minute.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: service
        in: query
        required: false
        schema:
          type: string
          enum:
          - VOLTE
          - SMS
      - name: scopeId
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:-]{1,96}$
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - OPEN
          - INVESTIGATING
          - RESOLVED
      - name: technicalState
        in: query
        required: false
        schema:
          type: string
          enum:
          - ONGOING
          - RECOVERED
          - UNKNOWN
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
  /api/incidents/{id}:
    get:
      operationId: getIncident
      summary: Get incident episode
      tags:
      - Incidents
      description: Return one analyst work item and its latest accepted detection. Historical detections are
        available from the separate paged detections endpoint.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/IncidentId'
  /api/incidents/{id}/detections:
    get:
      operationId: getIncidentDetections
      summary: Get immutable evidence history
      tags:
      - Incidents
      description: Order by sequence ASC. Preserve evidence from every accepted episode event.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/IncidentId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
  /api/incidents/{id}/status:
    post:
      operationId: changeIncidentStatus
      summary: Change analyst workflow status
      tags:
      - Incidents
      description: Assigned analyst or supervisor/admin. OPEN -> INVESTIGATING requires assignee. INVESTIGATING
        -> RESOLVED requires technicalState RECOVERED and nonblank resolutionNote. Version conflict returns
        409. Technical recovery never resolves analyst work automatically.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStatusRequest'
      security:
      - sessionCookie: []
        csrfToken: []
  /api/incidents/{id}/assignment:
    post:
      operationId: assignIncident
      summary: Assign an incident
      tags:
      - Incidents
      description: Analyst can claim unassigned work for self; supervisors/admins can reassign to enabled analysts.
        Optimistic locking and audit are transactional.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
      security:
      - sessionCookie: []
        csrfToken: []
  /api/incidents/{id}/comments:
    post:
      operationId: commentOnIncident
      summary: Add a comment
      tags:
      - Incidents
      description: Assigned analyst or supervisor/admin; requestId provides comment idempotency.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentRequest'
      security:
      - sessionCookie: []
        csrfToken: []
  /api/incidents/{id}/timeline:
    get:
      operationId: getIncidentTimeline
      summary: Get analyst audit
      tags:
      - Incidents
      description: Return analyst and system audit events ordered by occurredAt ASC,id ASC. Detection evidence
        is exposed separately and is never collapsed into this workflow timeline.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/IncidentId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
  /api/services:
    get:
      operationId: listServices
      summary: List monitored scopes
      tags:
      - Services
      description: Return each monitored service scope with its latest persisted KPI window, source freshness
        and unresolved incident count. Missing telemetry is distinct from a measured zero.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceSummary'
                maxItems: 200
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/services/{scopeId}/kpis:
    get:
      operationId: getServiceKpis
      summary: Read KPI history
      tags:
      - Services
      description: Maximum 24 hours/1440 minute windows; reject reversed or excessive ranges. Show null/missing
        separately from zero.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceKpiPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: scopeId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:-]{1,96}$
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
          pattern: Z$
        description: Inclusive UTC start instant.
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
          pattern: Z$
        description: Exclusive UTC end instant; must be after from and no more than 24 hours later.
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
  /api/incidents/stream:
    get:
      operationId: streamIncidents
      summary: Session-bound SSE updates
      tags:
      - Incidents
      description: |
        Emits `ready` on each connection. The client must refresh authoritative REST list,
        detail, detection and audit data after every `ready`, including reconnects.
        A committed change emits `incident-upsert` with data
        `{"id":"<incident UUID>","version":7}`. Heartbeats are SSE comments.
        An equal-version hint may represent an audit-only comment, so refresh the
        visible timeline even when the incident version is unchanged. Logout or
        session expiry closes the stream. This stream has no durable replay cursor;
        Last-Event-ID is not supported. Refresh REST after reconnect to repair
        notifications missed during a disconnect.
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/simulator/scenarios/{type}:
    post:
      operationId: startScenario
      summary: Schedule a synthetic service scenario
      tags:
      - Simulator
      description: 'Supervisor/admin only. Server schedules the next full minute: two normal, three degraded,
        three recovery windows (8 minutes). Rate/duration are fixed by versioned scenario profile, not arbitrary
        request fields. Persist requestId/body hash/runId in incidents_db; retries reuse the saved command
        and generator runId. Same ID with different body returns 409.'
      responses:
        '202':
          description: Scenario accepted and durably scheduled. An exact retry returns the same run and schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
          enum:
          - VOLTE_IMS_OVERLOAD
          - SMS_QUEUE_DELAY
          - NORMAL_CONTROL
          - TELEMETRY_GAP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartScenarioRequest'
      security:
      - sessionCookie: []
        csrfToken: []
  /api/simulator/runs/{runId}:
    get:
      operationId: getScenarioRun
      summary: Read scenario progress
      tags:
      - Simulator
      description: Supervisor/admin only. Read the durable public command state by the stable run ID; the browser
        never calls the private generator directly.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
