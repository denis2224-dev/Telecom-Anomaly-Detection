        latestWindowEnd: {type: string, format: date-time, nullable: true}
        freshness: {type: string, enum: [FRESH, STALE, MISSING, NEVER_SEEN]}
        technicalActiveCount: {type: integer, minimum: 0}
        analystOpenCount: {type: integer, minimum: 0}
        coverage: {$ref: '#/components/schemas/GeographyCoverage'}
        metric: {$ref: '#/components/schemas/GeographyMetric'}
    GeographyCitySummary:
      type: object
