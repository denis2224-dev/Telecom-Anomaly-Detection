    StartScenarioRequest:
      type: object
      additionalProperties: false
      properties:
        requestId: *id004
        seed:
          type: integer
          minimum: 0
        scopeId: *id005
      required:
      - requestId
      - seed
      - scopeId
    ScenarioRun:
      type: object
      additionalProperties: false
      properties:
        runId: *id004
        status:
          type: string
          enum:
          - SCHEDULED
          - RUNNING
          - COMPLETED
          - STOPPED
          - FAILED
        scheduledStartAt: *id003
        scheduledEndAt: *id003
        scenarioType:
          type: string
          enum:
          - VOLTE_IMS_OVERLOAD
          - SMS_QUEUE_DELAY
          - NORMAL_CONTROL
          - TELEMETRY_GAP
        scopeId: *id005
      required:
      - runId
      - status
      - scheduledStartAt
      - scheduledEndAt
      - scenarioType
      - scopeId
    ServiceKpiPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceKpiWindow'
          maxItems: 100
        total:
          type: integer
          minimum: 0
          maximum: 1440
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        observedAt: *id003
      required:
      - items
      - total
      - page
      - size
      - observedAt
    DetectionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceDetection'
          maxItems: 100
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
      required:
      - items
      - total
      - page
      - size
    ServiceSummary:
      type: object
      additionalProperties: false
      properties:
        scope:
          $ref: '#/components/schemas/ServiceScope'
        freshness:
          type: string
          enum:
          - FRESH
          - STALE
          - MISSING
        observedAt: *id003
        openIncidents:
          type: integer
          minimum: 0
        latestWindow:
          type: object
          nullable: true
          properties:
            schemaVersion:
              type: integer
              enum:
              - 2
            windowId:
              type: string
              minLength: 1
              maxLength: 160
            scopeId:
              type: string
              pattern: ^[A-Za-z0-9_.:-]{1,96}$
            service:
              type: string
              enum:
              - VOLTE
              - SMS
            windowStart:
              type: string
              format: date-time
              pattern: Z$
            windowEnd:
              type: string
              format: date-time
              pattern: Z$
            quality:
              type: string
              enum:
              - COMPLETE
              - INCOMPLETE
              - MISSING
            baselineVersion:
              type: string
              minLength: 1
              maxLength: 160
            topologyVersion:
              type: string
              minLength: 1
              maxLength: 160
            kpis:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 160
                  observed:
                    type: number
                    nullable: true
                  baseline:
                    type: number
                    nullable: true
                  unit:
                    type: string
                    enum:
                    - PERCENT
                    - PERCENTAGE_POINTS
                    - RATIO
                    - COUNT
                    - MILLISECONDS
                    - SECONDS
                    - MBPS
                  numerator:
                    type: number
                    nullable: true
                  denominator:
                    type: number
                    nullable: true
                required:
                - name
                - observed
                - baseline
                - unit
                - numerator
                - denominator
              maxItems: 30
            featureNames:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 160
              maxItems: 20
            featureValues:
              type: array
              items:
                type: number
                minimum: -1000000000.0
                maximum: 1000000000.0
              maxItems: 20
            mlEligible:
              type: boolean
            sourceEventIds:
              type: array
              items:
                type: string
                format: uuid
              maxItems: 20
            featureVersion:
              type: integer
              enum:
              - 2
          required:
          - schemaVersion
          - featureVersion
          - windowId
          - scopeId
          - service
          - windowStart
          - windowEnd
          - quality
          - baselineVersion
          - topologyVersion
          - kpis
          - featureNames
          - featureValues
          - mlEligible
          - sourceEventIds
          additionalProperties: false
      required:
      - scope
      - freshness
      - observedAt
      - openIncidents
      - latestWindow
    SmsShadowEvidence:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - evidenceId
      - windowId
      - service
      - scopeId
      - windowStart
      - windowEnd
      - featureVersion
      - baselineVersion
      - topologyVersion
      - requestedAt
      - completedAt
      - requestedModelVersion
      - modelVersion
      - modelSha256
      - mlStatus
      - classifierScore
      - detection
      - threshold
      properties:
        schemaVersion:
          enum:
          - 1
          type: integer
        evidenceId:
          type: string
          pattern: ^[a-f0-9]{64}$
        windowId:
          type: string
          pattern: ^[a-f0-9]{64}$
        service:
          enum:
          - SMS
          type: string
        scopeId:
          type: string
          pattern: ^[A-Za-z0-9_.:-]{1,96}$
        windowStart:
          type: string
          format: date-time
          pattern: Z$
        windowEnd:
          type: string
          format: date-time
          pattern: Z$
        requestedAt:
          type: string
          format: date-time
          pattern: Z$
        completedAt:
          type: string
          format: date-time
          pattern: Z$
        featureVersion:
          enum:
          - 2
          type: integer
        baselineVersion:
          enum:
          - baseline-v2
          type: string
        topologyVersion:
          type: string
          minLength: 1
        requestedModelVersion:
          enum:
          - sms-supervised-v1-2
          type: string
        modelVersion:
          enum:
          - sms-supervised-v1-2
          nullable: true
          type: string
        modelSha256:
          enum:
          - f3baf6be91d56c0a8054a9cd81e028774e3af9464d8124a81aa89180030c9f19
          type: string
        mlStatus:
          enum:
          - OK
          - DISABLED
          - UNAVAILABLE
          - TIMEOUT
          - INSUFFICIENT_DATA
          - MALFORMED_RESPONSE
        classifierScore:
          type: number
          minimum: 0
          maximum: 1
          description: Uncalibrated fault-class score; never anomalyRank or a fault probability.
          nullable: true
        detection:
          type: boolean
          nullable: true
        threshold:
          enum:
          - 0.55
          type: number
      description: Canonical event sms-shadow-evidence-v1. OK requires a score, boolean
        decision, and modelVersion. Failure predictions and modelVersion are null. Cutoff
        decision is inclusive at 0.55.
    MlShadowPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/SmsShadowEvidence'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
