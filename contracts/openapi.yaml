openapi: 3.0.3

info:
  title: Telecom Incident API
  version: 0.1.0
  description: >
    Day-one draft of the incident-service API.
    Detailed reason and evidence schemas require review with
    the detection and streaming owners.

servers:
  - url: http://localhost:8082
    description: Planned local incident-service address

security:
  - sessionCookie: []

paths:
  /api/incidents/{id}:
    get:
      operationId: getIncidentById
      summary: Get an incident by ID
      description: >
        Returns incident details for a signed-in ANALYST,
        SUPERVISOR, or ADMIN.
      tags:
        - Incidents

      parameters:
        - name: id
          in: path
          required: true
          description: Identifier generated by the incident-service.
          schema:
            type: string
            minLength: 1
          example: inc-001

      responses:
        "200":
          description: Incident found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"

        "401":
          description: Authentication is missing or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

        "404":
          description: No incident exists with the supplied ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: INCIDENT_NOT_FOUND
                message: Incident inc-001 was not found.
                fieldErrors: []
                requestId: req-001

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: telecom_session
      description: >
        Planned signed JWT session cookie.
        Confirm the cookie name with the frontend owner.

  schemas:
    Incident:
      type: object

      required:
        - id
        - detectionId
        - anomalyType
        - entityType
        - entityId
        - status
        - severity
        - riskScore
        - uncappedScore
        - assigneeId
        - resolutionNote
        - windowStart
        - windowEnd
        - detectedAt
        - createdAt
        - updatedAt
        - version
        - rulesetVersion
        - featureVersion
        - modelVersion
        - mlStatus
        - modelScore
        - reasons
        - evidence

      properties:
        id:
          type: string
          example: inc-001

        detectionId:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Stable SHA-256 detection identifier.

        anomalyType:
          type: string
          enum:
            - ACCOUNT_COMPROMISE
            - NETWORK_OUTAGE
            - BILLING_DUPLICATE
            - ML_DEVIATION

        entityType:
          type: string
          enum: [SUBSCRIBER, NODE]

        entityId:
          type: string
          example: SUB-001

        status:
          type: string
          enum: [OPEN, INVESTIGATING, RESOLVED]

        severity:
          type: string
          enum: [MEDIUM, HIGH, CRITICAL]

        riskScore:
          type: integer
          minimum: 40
          maximum: 100

        uncappedScore:
          type: integer
          minimum: 40
          description: Total score before applying the cap of 100.

        assigneeId:
          type: string
          nullable: true

        resolutionNote:
          type: string
          nullable: true
          description: Required and non-empty when status is RESOLVED.

        windowStart:
          type: string
          format: date-time

        windowEnd:
          type: string
          format: date-time

        detectedAt:
          type: string
          format: date-time

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

        version:
          type: integer
          format: int64
          minimum: 0

        rulesetVersion:
          type: string
          example: "1"

        featureVersion:
          type: integer
          enum: [1]

        modelVersion:
          type: string
          nullable: true

        mlStatus:
          type: string
          example: UNAVAILABLE
          description: Exact allowed values require detection-owner review.

        modelScore:
          type: number
          nullable: true

        scenarioRunId:
          type: string
          description: Optional simulator run identifier.

        reasons:
          type: array
          minItems: 1
          description: >
            Structured explanations supplied by the detector.
            Nested fields will be specified after shared contract review.
          items:
            type: object
            additionalProperties: true

        evidence:
          type: array
          maxItems: 20
          description: >
            Sample supporting events.
            Typed event schemas will be added after shared contract review.
          items:
            type: object
            additionalProperties: true

    ApiError:
      type: object
      required:
        - code
        - message
        - fieldErrors
        - requestId

      properties:
        code:
          type: string
          example: INCIDENT_NOT_FOUND

        message:
          type: string
          example: Incident inc-001 was not found.

        fieldErrors:
          type: array
          description: Empty when the error is not field-specific.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string

        requestId:
          type: string
          example: req-001