name: incident-runtime-image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the Compose-managed incident service image
        run: docker build --file services/incident-service/Dockerfile --tag incident-service:ci .
