name: dashboard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dashboard-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - name: Verify isolated-runner safety
        working-directory: .
        run: node --test scripts/pr77-*.test.cjs
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --workers=2
      - name: Verify keyboard navigation and persisted investigation across browsers
        run: npx playwright test accessibility.spec.ts trace-history.spec.ts native-investigation.spec.ts trace-release-acceptance.spec.ts --browser=all --workers=2
      - name: Save browser reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-results
          path: apps/dashboard/test-results/dashboard/
