name: Service assurance CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts-and-tests:
    name: Contracts and owner tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install contract check dependencies
        run: python -m pip install --disable-pip-version-check jsonschema openapi-spec-validator PyYAML

      - name: Validate contracts and reference checks
        run: |
          python scripts/check-contracts.py
          python -m unittest discover -s tests -v

      - name: Build and test Java owners
        run: ./mvnw -B -ntp test

  compose-first-slice:
    name: Bounded Compose first slice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: contracts-and-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start first slice
        run: ./scripts/up

      - name: Verify runtime boundaries
        run: ./scripts/verify

      - name: Collect redacted Compose evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/compose-evidence"
          docker compose ps > "$RUNNER_TEMP/compose-evidence/services.txt" || true
          docker compose logs --no-color > "$RUNNER_TEMP/compose-evidence/logs.txt" || true
          sed -E \
            -e 's/(PASSWORD|TOKEN|SECRET|COOKIE|AUTHORIZATION)[=:][^[:space:]]+/\1=[REDACTED]/gi' \
            -e 's/(postgresql:\/\/[^:]+:)[^@]+@/\1[REDACTED]@/gi' \
            "$RUNNER_TEMP/compose-evidence/logs.txt" > "$RUNNER_TEMP/compose-evidence/logs-redacted.txt"
          rm "$RUNNER_TEMP/compose-evidence/logs.txt"
          echo "Compose evidence retained in the job workspace (credentials redacted)."

      - name: Upload Compose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-first-slice-evidence
          path: ${{ runner.temp }}/compose-evidence
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down first slice
        if: always()
        run: docker compose down --volumes --remove-orphans
