name: service-integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: service-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate geography startup alignment
        run: python -m unittest tests.test_geography_alignment -v

  model-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation and ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r services/ml-service/requirements-ml.txt
      - name: Validate contracts and packaged models
        run: |
          python scripts/check-contracts.py
          python -m unittest discover -s tests -v
          python -m unittest discover -s services/ml-service/tests -v
      - name: Rebuild deterministic evaluation data
        run: python services/ml-service/training/generate_history.py
      - name: Evaluate local packaged models
        run: python services/ml-service/training/evaluate.py --output tmp/integration-model-evaluation.json
      - name: Build and start private ML inference
        run: |
          docker build -f services/ml-service/Dockerfile -t telecom-ml-integration .
          docker run --detach --rm --name telecom-ml-integration -p 8090:8090 telecom-ml-integration
          trap 'docker stop telecom-ml-integration' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8090/health/ready && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8090/health/ready
          python services/ml-service/training/evaluate.py \
            --api-url http://127.0.0.1:8090 \
            --output tmp/integration-http-evaluation.json

  processor-evaluation:
    runs-on: ubuntu-latest
    needs: model-evaluation
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install geographic parity dependencies
        run: python -m pip install -r requirements-dev.txt -r services/ml-service/requirements-ml.txt
      - name: Verify processor dependency outages and replay boundaries
        run: ./mvnw --batch-mode --no-transfer-progress -pl services/processor -am verify
      - name: Save processor outage evidence and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processor-dependency-outage-evidence
          path: |
            services/processor/target/day17-dependency-outages.json
            services/processor/target/surefire-reports/
      - name: Start private ML inference
        run: |
          docker build -f services/ml-service/Dockerfile -t telecom-ml-integration .
          docker run --detach --rm --name telecom-ml-integration -p 8090:8090 telecom-ml-integration
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8090/health/ready && break
            sleep 2
          done
      - name: Replay controls without ML service
        run: >
          ./mvnw -pl services/processor -am test
          -Dtest=VoiceDeliveryTest#committedWindowsProduceOneDurableEpisodeAndIdenticalReplayProducesNothing,SmsDeliveryTest#completeSmsWindowsProduceOneRecoveredEpisodeWithoutMlService
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Verify processor delivery fairness, scheduling isolation, and replay ordering
        run: >
          ./mvnw -pl services/processor -am test
          -Dtest=VoiceDeliverySchedulingTest,DetectionReplayIT,ReplayIT#producerAckWithoutPublishedMarkRetriesIdenticalKpiAndDetectionWireIdentity
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Replay both service profiles with packaged model
        env:
          ML_SERVICE_URL: http://127.0.0.1:8090
        run: >
          ./mvnw -pl services/processor -am test
          -Dtest=VoiceDeliveryTest#livePackagedModelEnrichesRecoveredVoiceEpisode,SmsDeliveryTest#livePackagedModelEnrichesRecoveredSmsEpisode
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Verify cause controls, bounded ML failures, and durable geographic replay
        run: >
          ./mvnw -pl services/processor -am test
          -Dtest=GeographicCauseControlsTest,MlClientTest,MlClientFailureTest,GeographicAuxiliaryBoundaryTest,GeographicMlFallbackReplayTest,GeographicCauseReplayTest,GeographicReplayTest,ExplanationCasesTest
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Run geographic processor and parity verification
        env:
          ML_SERVICE_URL: http://127.0.0.1:8090
        run: |
          ./mvnw -pl services/processor -am test \
            -Dtest=GeographicDetectionTest,GeographicWorkerTest,GeographicParityTest,GeographicSmsBaselineTest,DetectionConfigurationTest,GeographicHistoricalBaselineReplayTest,GeographicWorkerReceiptBoundaryTest,GeographicDetectorAcceptanceTest,GeographicEvidenceIsolationTest,Day5GeographicParityTest \
            -Dsurefire.failIfNoSpecifiedTests=false
          python scripts/check-voice-parity.py --geographic \
            --java-output services/processor/target/geographic-voice-parity-java.json
          python scripts/check-sms-parity.py --geographic \
            --java-output services/processor/target/geographic-sms-parity-java.json
          python scripts/check-voice-parity.py --geographic-persisted \
            --java-output services/processor/target/day5-geographic-parity-java.json
          python scripts/check-sms-parity.py --geographic-persisted \
            --java-output services/processor/target/day5-geographic-parity-java.json
          python tasks/sergiu-day5-acceptance/check_geographic_http.py
      - name: Save geographic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geographic-acceptance-evidence
          path: |
            services/processor/target/geographic-*-java.json
            services/processor/target/day5-*.json
            services/processor/target/surefire-reports/
            output/day5-reconciliation/geographic-ml.json
      - name: Stop private ML inference
        if: always()
        run: docker stop telecom-ml-integration || true
