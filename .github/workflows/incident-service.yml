name: incident-service

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/incident-service/pom.xml
      - name: Verify incident service with PostgreSQL and Kafka tests
        working-directory: services/incident-service
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incident-service-test-reports
          path: |
            services/incident-service/target/surefire-reports/
            services/incident-service/target/failsafe-reports/
