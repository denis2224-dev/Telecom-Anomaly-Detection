server:
  port: ${SERVER_PORT:8083}
spring:
  application:
    name: processor
  datasource:
    url: ${PROCESSING_DB_URL}
    username: ${PROCESSING_DB_USER}
    password: ${PROCESSING_DB_PASSWORD}
    hikari:
      connection-timeout: 2000
  flyway:
    url: ${PROCESSING_DB_URL}
    user: ${PROCESSING_MIGRATOR_USER}
    password: ${PROCESSING_MIGRATOR_PASSWORD}
    default-schema: app
    schemas: app
    create-schemas: false
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: telecom-processor-v2
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: manual_immediate
    admin:
      auto-create: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,kafka,db
telecom:
  retention:
    enabled: ${PROCESSOR_RETENTION_ENABLED:true}
    receipt-horizon: ${PROCESSOR_RECEIPT_HORIZON:48h}
    rejection-horizon: ${PROCESSOR_REJECTION_HORIZON:48h}
    raw-kafka-horizon: ${KAFKA_RAW_RETENTION_MS:86400000}ms
    batch-size: ${PROCESSOR_RETENTION_BATCH_SIZE:100}
    poll-interval: ${PROCESSOR_RETENTION_POLL_INTERVAL:60s}
  sms-shadow:
    enabled: ${ML_SMS_SHADOW_ENABLED:false}
    poll-interval: ${ML_SMS_SHADOW_POLL_INTERVAL:1000}
  history:
    enabled: ${TELECOM_HISTORY_ENABLED:${HISTORICAL_BOOTSTRAP_ENABLED:false}}
    days: ${TELECOM_HISTORY_DAYS:${HISTORICAL_BOOTSTRAP_DAYS:30}}
    seed: ${TELECOM_HISTORY_SEED:${HISTORICAL_BOOTSTRAP_SEED:42}}
  geographic-history:
    enabled: ${TELECOM_GEOGRAPHICHISTORY_ENABLED:false}
    days: ${TELECOM_GEOGRAPHICHISTORY_DAYS:2}
    seed: ${TELECOM_GEOGRAPHICHISTORY_SEED:42}
    job-id: ${TELECOM_GEOGRAPHICHISTORY_JOBID:geographic-demo-v1}
    minutes: ${TELECOM_GEOGRAPHICHISTORY_MINUTES:}
  rejection-delivery:
    enabled: ${REJECTION_DELIVERY_ENABLED:true}
    invalid-topic: ${KAFKA_V2_INVALID_TOPIC:telecom.observations.invalid.v2}
    late-topic: ${KAFKA_V2_LATE_TOPIC:telecom.observations.late.v2}
    poll-interval: ${REJECTION_DELIVERY_POLL_INTERVAL:1000}
    batch-size: ${REJECTION_DELIVERY_BATCH_SIZE:100}
  finalization:
    enabled: ${VOICE_FINALIZATION_ENABLED:true}
    poll-interval: ${VOICE_FINALIZATION_POLL_INTERVAL:1000}
    batch-size: ${VOICE_FINALIZATION_BATCH_SIZE:100}
  kafka-readiness:
    timeout: ${KAFKA_READINESS_TIMEOUT:2s}
    poll-interval: ${KAFKA_READINESS_POLL_INTERVAL:1s}
logging:
  pattern:
    level: "%5p %kvp"
  level:
    org.apache.kafka: ERROR
