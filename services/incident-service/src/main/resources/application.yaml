spring:
  config:
    import: "optional:file:../../.env[.properties]"
  application:
    name: IncidentService
  datasource:
    url: ${INCIDENT_DB_URL:jdbc:postgresql://localhost:5432/incidents_db?currentSchema=app}
    username: ${INCIDENT_DB_USER:incidents_app}
    password: ${INCIDENT_DB_PASSWORD}
    hikari:
      connection-timeout: ${INCIDENT_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${INCIDENT_DB_VALIDATION_TIMEOUT_MS:1000}
  flyway:
    url: ${INCIDENT_DB_URL:jdbc:postgresql://localhost:5432/incidents_db?currentSchema=app}
    user: ${INCIDENT_MIGRATOR_USER:incidents_migrator}
    password: ${INCIDENT_MIGRATOR_PASSWORD}
    default-schema: app
    schemas: app
    create-schemas: false
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: telecom-web
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "${APP_PUBLIC_ORIGIN:http://telecom.test:8080}/login/oauth2/code/keycloak"
            scope: openid,profile
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER:http://telecom.test:8080/auth/realms/telecom}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: incident-service-v2
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: manual_immediate

server:
  port: 8082
  servlet:
    session:
      timeout: 15m
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        path: /
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

app:
  trace-domain-read-model:
    enabled: ${TRACE_DOMAIN_READ_MODEL_ENABLED:false}
  trace-link:
    scenarios:
      enabled: ${TRACE_LINK_SCENARIOS_ENABLED:false}
      reconcile-ms: 5000
  public-origin: ${APP_PUBLIC_ORIGIN:http://telecom.test:8080}
  evidence:
    reconcile-enabled: ${EVIDENCE_RECONCILE_ENABLED:true}
    reconcile-ms: 5000
  kafka:
    topics:
      detections: ${KAFKA_V2_DETECTIONS_TOPIC:telecom.detections.v2}
      kpis: ${KAFKA_V2_KPIS_TOPIC:telecom.kpis.v2}
      sms-shadow: telecom.ml-shadow.sms.v1
      coverage: ${KAFKA_COVERAGE_TOPIC:telecom.coverage.v1}
      domain-detections: ${KAFKA_TRACE_DOMAIN_DETECTIONS_TOPIC:telecom.trace-domain.detections.v1}
  simulator:
    generator-base-url: ${GENERATOR_BASE_URL:http://127.0.0.1:${GENERATOR_HOST_PORT:8081}}
    reconcile-ms: 5000
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:true}
    push-enabled: ${NOTIFICATION_PUSH_ENABLED:false}
    vapid-public-key: ${NOTIFICATION_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${NOTIFICATION_VAPID_PRIVATE_KEY:}
    vapid-subject: ${NOTIFICATION_VAPID_SUBJECT:}
    encryption-key: ${NOTIFICATION_ENCRYPTION_KEY:}
    delivery:
      batch-size: 50
      poll-ms: 2000
      lease-seconds: 60
      max-attempts: 6

  tracelink:
    domain-detections-enabled: ${TRACE_DOMAIN_DETECTIONS_ENABLED:false}
telecom:
  trace-link:
    enabled: ${TRACE_LINK_ENABLED:false}
    topic: ${TRACE_LINK_DETECTIONS_TOPIC:telecom.detections.trace-link.v1}
