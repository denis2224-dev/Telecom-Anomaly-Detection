spring:
  config:
    import: "optional:file:../../.env[.properties]"
  application:
    name: IncidentService
  datasource:
    url: ${INCIDENT_DB_URL:jdbc:postgresql://localhost:5432/incidents_db?currentSchema=app}
    username: ${INCIDENT_DB_USER:incidents_app}
    password: ${INCIDENT_DB_PASSWORD}
  flyway:
    url: ${INCIDENT_DB_URL:jdbc:postgresql://localhost:5432/incidents_db?currentSchema=app}
    user: ${INCIDENT_MIGRATOR_USER:incidents_migrator}
    password: ${INCIDENT_MIGRATOR_PASSWORD}
    default-schema: app
    schemas: app
    create-schemas: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: telecom-web
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "${APP_PUBLIC_ORIGIN:http://telecom.test:8080}/login/oauth2/code/keycloak"
            scope: openid,profile
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER:http://telecom.test:8080/auth/realms/telecom}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: incident-service-v2
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: manual_immediate

server:
  port: 8082
  servlet:
    session:
      timeout: 15m
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        path: /
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  public-origin: ${APP_PUBLIC_ORIGIN:http://telecom.test:8080}
  kafka:
    topics:
      detections: ${KAFKA_V2_DETECTIONS_TOPIC:telecom.detections.v2}
      kpis: ${KAFKA_V2_KPIS_TOPIC:telecom.kpis.v2}