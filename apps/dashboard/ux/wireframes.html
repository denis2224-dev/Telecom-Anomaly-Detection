<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Telecom · Day 01 wireframes</title>
    <link rel="stylesheet" href="wireframes.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true">T</span
        ><span>TELECOM<small>NETWORK OPERATIONS</small></span>
      </div>
      <span class="account" id="actor">David Nenita · Analyst</span>
    </header>
    <div class="layout">
      <nav aria-label="Wireframe screens">
        <p>WORKSPACE</p>
        <button id="dashboardNav" class="active">Overview</button
        ><button id="incidentsNav">Incidents</button>
      </nav>
      <main>
        <div class="review">
          <span>DAY 01 / DESIGN PREVIEW · Invented fixture data</span
          ><label for="state"
            >Screen state
            <select id="state">
              <option value="live">Live (fixture)</option>
              <option value="signed-out">Signed out</option>
              <option value="loading">Loading</option>
              <option value="empty">Empty</option>
              <option value="error">Error</option>
              <option value="session-expired">Session expired</option>
              <option value="forbidden">Forbidden · 403</option>
              <option value="conflict">Conflict · 409</option>
              <option value="disconnected">Disconnected</option>
            </select></label
          >
        </div>
        <div id="content" aria-live="polite"></div>
        <p class="footer">
          UX wireframe · API contracts pending producer review · Times shown in
          Europe/Chisinau
        </p>
      </main>
    </div>
    <script src="wireframes.js"></script>
  </body>
</html>
