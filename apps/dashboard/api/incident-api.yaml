            windowEnd: {type: string, format: date-time}
            detectedAt: {type: string, format: date-time}
            revision: {type: integer, minimum: 0}
        primitiveEvidence:
          type: object
          required: [payload, quality, coverage, numerator, denominator]
          properties:
            payload: {type: object, additionalProperties: true}
            quality: {type: string, enum: [VALID, PARTIAL, MISSING, STALE, INSUFFICIENT_EVIDENCE]}
            coverage: {type: number, minimum: 0, maximum: 1}
            numerator: {type: number, nullable: true}
            denominator: {type: number, nullable: true}
        causeStatus: {type: string, enum: [UNDETERMINED]}
        probableCause: {type: string, nullable: true}
        causeConfidence: {type: string, nullable: true}
    TraceSnapshot:
      type: object
      required: [datasetId, domain, scopeType, scopeId, at, snapshotAt, sourceAgeSeconds, value, unit, coverage, quality, policyVersion, topologyVersion, synthetic]
      properties:
        datasetId: {type: string}
        domain: {type: string}
        scopeType: {type: string}
        scopeId: {type: string}
        at: {type: string, format: date-time}
        snapshotAt: {type: string, format: date-time, nullable: true}
        sourceAgeSeconds: {type: integer, format: int64, nullable: true}
        value: {type: number, nullable: true}
        unit: {type: string}
        coverage: {type: number, minimum: 0, maximum: 1}
        quality: {type: string, enum: [VALID, PARTIAL, MISSING, STALE, INSUFFICIENT_EVIDENCE]}
        policyVersion: {type: string, nullable: true}
        topologyVersion: {type: string, nullable: true}
        synthetic: {type: boolean}
    NotificationPage:
      type: object
      required: [items, total, unreadCount, page, size]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/NotificationItem'}}
        total: {type: integer, format: int64}
        unreadCount: {type: integer, format: int64}
        page: {type: integer}
        size: {type: integer}
    NotificationItem:
      type: object
      required: [id, incidentId, kind, severity, service, scopeId, summary, occurredAt, readAt, causeStatus, probableCause, causeConfidence, incidentUrl]
      properties:
        id: {type: string, format: uuid}
        incidentId: {type: string, format: uuid}
        kind: {type: string, enum: [OPEN, ESCALATED, RECOVERED, ASSIGNED]}
        severity: {type: string, enum: [MEDIUM, HIGH, CRITICAL]}
        service: {type: string}
        scopeId: {type: string}
        summary: {type: string, maxLength: 500}
        occurredAt: {type: string, format: date-time}
        readAt: {type: string, format: date-time, nullable: true}
        causeStatus: {type: string, enum: [HYPOTHESIS, UNDETERMINED]}
        probableCause: {type: string, nullable: true}
        causeConfidence: {type: string, nullable: true}
        incidentUrl: {type: string, pattern: '^/incidents/[0-9a-f-]+$'}
    PushConfig:
      type: object
      required: [enabled, vapidPublicKey]
      properties:
        enabled: {type: boolean}
        vapidPublicKey: {type: string, nullable: true}
    PushSubscriptionInput:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        endpoint: {type: string, format: uri, maxLength: 2048}
        p256dh: {type: string, maxLength: 256}
        auth: {type: string, maxLength: 256}
        expirationTime: {type: string, format: date-time, nullable: true}

    TraceScenarioScope:
      type: object
      additionalProperties: false
      required:
      - domain
      - id
      - direction
      - country
      - procedure
      - topologyVersion
      properties:
        domain:
          type: string
          enum:
          - TRANSPORT
          - ROAMING
          - MOBILE_DATA
        id:
          type: string
        direction:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        procedure:
          type: string
          nullable: true
        topologyVersion:
          type: string
          enum:
          - trace-link-links-v1
    TraceScenarioParameters:
      type: object
      additionalProperties: false
      required:
      - normalUtilizationBp
      - degradedUtilizationBp
      - healthySuccessBp
      - degradedSuccessBp
      - capacityGbps
      - attempts
      - missingMinutes
      properties:
        normalUtilizationBp:
          type: integer
          minimum: 0
          maximum: 10000
        degradedUtilizationBp:
          type: integer
          minimum: 0
          maximum: 10000
        healthySuccessBp:
          type: integer
          minimum: 0
          maximum: 10000
        degradedSuccessBp:
          type: integer
          minimum: 0
          maximum: 10000
        capacityGbps:
          type: integer
          minimum: 1
          maximum: 1000
        attempts:
          type: integer
          minimum: 0
          maximum: 1000000
        missingMinutes:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 7
    TraceScenarioStart:
      type: object
      additionalProperties: false
      required:
      - requestId
      - type
      - version
      - scope
      - seed
      properties:
        requestId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - TRANSPORT_LINK_OVERLOAD
          - ROAMING_REGISTRATION_FAILURE
          - MOBILE_DATA_DNS_FAILURE
          - NORMAL_CONTROL
          - TELEMETRY_GAP
        version:
          type: string
          enum:
          - trace-link-scenarios-v1
        scope:
          $ref: '#/components/schemas/TraceScenarioScope'
        seed:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        parameters:
          $ref: '#/components/schemas/TraceScenarioParameters'
    TraceScenarioCommand:
      type: object
      additionalProperties: false
      required:
      - type
      - version
      - scope
      - seed
      - parameters
      - start
      properties:
        type:
          type: string
          enum:
          - TRANSPORT_LINK_OVERLOAD
          - ROAMING_REGISTRATION_FAILURE
          - MOBILE_DATA_DNS_FAILURE
          - NORMAL_CONTROL
          - TELEMETRY_GAP
        version:
          type: string
          enum:
          - trace-link-scenarios-v1
        scope:
          $ref: '#/components/schemas/TraceScenarioScope'
        seed:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        parameters:
          $ref: '#/components/schemas/TraceScenarioParameters'
        start:
          type: string
          format: date-time
    TraceScenarioDefinition:
      type: object
      additionalProperties: false
      required:
      - type
      - version
      - domains
      - scopeTypes
      - implemented
      - parameterRanges
      - expectedPrimitiveChanges
      - positiveControl
      - negativeControl
      properties:
        type:
          type: string
        version:
          type: string
        domains:
          type: array
          items:
            type: string
        scopeTypes:
          type: array
          items:
            type: string
        implemented:
          type: boolean
        parameterRanges:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required:
            - minimum
            - maximum
            properties:
              minimum:
                type: number
              maximum:
                type: number
        expectedPrimitiveChanges:
          type: string
        positiveControl:
          type: string
        negativeControl:
          type: string
    TraceScenarioCatalogue:
      type: object
      additionalProperties: false
      required:
      - enabled
      - synthetic
      - version
      - deliveryStatus
      properties:
        enabled:
          type: boolean
        synthetic:
          type: boolean
          enum:
          - true
        version:
          type: string
        deliveryStatus:
          type: string
          enum:
          - DISABLED_PENDING_REVIEW
        topologyVersion:
          type: string
        sourceNamespace:
          type: string
        definitions:
          type: array
          maxItems: 18
          items:
            $ref: '#/components/schemas/TraceScenarioDefinition'
        defaults:
          $ref: '#/components/schemas/TraceScenarioParameters'
        scopes:
          type: array
          maxItems: 54
          items:
            type: object
            additionalProperties: false
            required:
            - scope
            - label
            properties:
              scope:
                $ref: '#/components/schemas/TraceScenarioScope'
              label:
                type: string
              sourceCity:
                type: string
              destinationCity:
                type: string
              nominalCapacityGbps:
                type: number
    TraceScenarioRun:
      type: object
      additionalProperties: false
      required:
      - runId
      - fingerprint
      - command
      - status
      - completedWindows
      - generatedObservations
      - deliveryStatus
      - offered
      - acknowledged
      - persisted
      - accepted
      properties:
        runId:
          type: string
          format: uuid
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        command:
          $ref: '#/components/schemas/TraceScenarioCommand'
        status:
          type: string
          enum:
          - SCHEDULED
          - RUNNING
          - COMPLETED
          - STOPPED
          - INTERRUPTED
          - FAILED
        completedWindows:
          type: integer
          minimum: 0
          maximum: 8
        generatedObservations:
          type: integer
          minimum: 0
          maximum: 24
        deliveryStatus:
          type: string
          enum:
          - DISABLED_PENDING_REVIEW
        offered:
          type: integer
          enum:
          - 0
        acknowledged:
          type: integer
          enum:
          - 0
        persisted:
          type: integer
          nullable: true
        accepted:
          type: integer
          nullable: true
        history:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required:
            - start
            - observations
            properties:
              start:
                type: string
                format: date-time
              observations:
                type: array
                maxItems: 3
                items:
                  type: string
