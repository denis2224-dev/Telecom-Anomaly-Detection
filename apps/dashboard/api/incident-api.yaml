components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Opaque server-session identifier, not a JWT. HttpOnly, SameSite=Lax, Path=/; Secure with
        HTTPS. 15-minute idle and 30-minute absolute expiry.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Token returned by GET /api/auth/csrf. Required alongside the session cookie for JSON mutations;
        never a replacement for authentication. POST /logout uses the _csrf form parameter instead.
  parameters:
    TraceLinkLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    TraceLinkOffset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
    TraceLinkEpisodeId:
      name: episodeId
      in: path
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{64}$'}
    GeographyCityId:
      name: cityId
      in: path
      required: true
      schema: {type: string, pattern: '^[A-Z]{3}$'}
    IncidentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Incident UUID, not a detectionId.
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Optional correlation UUID; generated by the server when absent. Must match a body requestId
        if both are provided.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
      description: Inclusive start instant.
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
      description: Exclusive end instant. Must be later than from.
    TraceCatalogueVersion:
      name: catalogueVersion
      in: query
      schema: {type: string, maxLength: 128}
      description: Omit for active inventory; provide a recorded version for historical evidence.
    TraceDomain:
      name: domain
      in: query
      required: true
      schema: {type: string, enum: [volte, transport, roaming, sms, mobile-data]}
    TraceMetric:
      name: metric
      in: query
      required: true
      schema: {type: string, maxLength: 96}
    TraceScopeType:
      name: scopeType
      in: query
      required: true
      schema: {type: string, enum: [CITY, LINK_DIRECTION, PARTNER_DIRECTION]}
    TraceScopeId:
      name: scopeId
      in: query
      required: true
      schema: {type: string, maxLength: 96}
    TraceResolution:
      name: resolution
      in: query
      required: true
      schema: {type: string, enum: [5m, 15m, 1h, 6h]}
    TraceDatasetId:
      name: datasetId
      in: query
      required: true
      schema: {type: string, maxLength: 128}
  responses:
    BadRequest:
      description: Malformed input, an invalid range or invalid request identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthenticated:
      description: No valid server session, or the session has expired. API requests receive JSON, not a login
        redirect.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Insufficient application role, disabled local analyst, wrong assignee or failed CSRF validation.
        CSRF rejection uses code CSRF_INVALID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Stale version or an incompatible workflow/assignment state. State failures use INVALID_TRANSITION
        or ASSIGNMENT_CONFLICT; currentVersion may be returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unavailable:
      description: A required dependency is unavailable; no secrets or internal exception text is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    TraceLinkIncidentPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TraceLinkIncidentView'}}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 100000}
    TraceLinkDetectionEvidencePage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TraceLinkDetectionEnvelope'}}
        total: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        offset: {type: integer, minimum: 0, maximum: 100000}
    TraceLinkIncidentView:
      type: object
      additionalProperties: false
      description: Read-only technical episode metadata. No analyst assignment, status, investigation, resolution or workflow audit is provided.
      required: [episodeId, firstObservedAt, detectedAt, latestWindowEnd, latestSequence, technicalState, severity, latestDetection]
      properties:
        episodeId: {type: string, pattern: '^[a-f0-9]{64}$'}
        firstObservedAt:
          type: string
          format: date-time
          description: Start of the first breached source window; stable for the episode.
        detectedAt:
          type: string
          format: date-time
          description: Evaluation time of the initial OPEN decision; stable through later transitions.
        latestWindowEnd: {type: string, format: date-time, description: End of the latest contiguously applied source window.}
        latestSequence: {type: integer, format: int64, minimum: 1}
        technicalState: {type: string, enum: [ONGOING, UNKNOWN, RECOVERED]}
        severity: {type: string, enum: [HIGH, CRITICAL]}
        latestDetection: {$ref: '#/components/schemas/TraceLinkDetectionEnvelope'}
    TraceLinkDetectionEnvelope:
      type: object
      additionalProperties: false
      x-json-schema: contracts/detections/trace-link-detection-v1.schema.json
      description: Strict wire JSON schema is authoritative for primitive evidence and cause validation.
      required: [schemaVersion, synthetic, lifecycle, context, cause, causeEvidence, committedAt]
      properties:
        schemaVersion: {type: string, enum: [trace-link-detection-v1]}
        synthetic: {type: boolean, enum: [true]}
        lifecycle:
          type: object
          required: [schemaVersion, episodeId, detectionId, sequence, phase, technicalState, severity, window, evaluation]
          properties:
            schemaVersion: {type: string, enum: [trace-link-lifecycle-v1]}
            episodeId: {type: string, pattern: '^[a-f0-9]{64}$'}
            detectionId: {type: string, pattern: '^[a-f0-9]{64}$'}
            sequence: {type: integer, minimum: 1}
            phase: {type: string, enum: [OPEN, UPDATE, UNKNOWN, RECOVERY]}
            technicalState: {type: string, enum: [ONGOING, UNKNOWN, RECOVERED]}
            severity: {type: string, enum: [HIGH, CRITICAL]}
            window: {type: object, additionalProperties: true}
            evaluation: {type: object, additionalProperties: true}
        context: {type: object, additionalProperties: true}
        cause: {type: object, additionalProperties: true}
        causeEvidence: {type: object, additionalProperties: true}
        committedAt: {type: string, format: date-time}
    TraceDomainMeasurementV1:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - mappingVersion
      - sourceKind
      - sourcePayloadBase64
      - sourcePayloadSha256
      - provenance
      properties:
        schemaVersion:
          enum:
          - trace-link-domain-measurement-v1
        mappingVersion:
          enum:
          - trace-link-domain-mapping-v1
        sourceKind:
          enum:
          - LIVE_60
          - NATIVE_300
        sourcePayloadBase64:
          type: string
          minLength: 1
          maxLength: 900000
        sourcePayloadSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        provenance:
          type: object
          additionalProperties: false
          required:
          - manifestSha256
          - generatorVersion
          - seed
          properties:
            manifestSha256:
              type: string
              pattern: ^[0-9a-f]{64}$
            generatorVersion:
              type: string
              minLength: 1
              maxLength: 160
            seed:
              type: integer
              minimum: 0
              maximum: 9223372036854775807
    TraceDomainNativePointV1:
      type: object
      required:
      - from
      - to
      - expectedSlots
      - receivedSlots
      - quality
      - value
      - sourceCoverage
      - nullReason
      - measurement
      - qualityReason
      - sourceQuality
      - eventId
      - revision
      - finalized
      - primitives
      - provenance
      - sourcePayloadSha256
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        expectedSlots:
          type: integer
          enum:
          - 1
        receivedSlots:
          type: integer
          enum:
          - 0
          - 1
        quality:
          type: string
          enum:
          - VALID
          - PARTIAL
          - MISSING
          - STALE
          - INSUFFICIENT_EVIDENCE
        value:
          type: number
          nullable: true
        sourceCoverage:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        nullReason:
          type: string
          nullable: true
          enum:
          - NO_SOURCE_SLOT
          - ZERO_DENOMINATOR
          - null
        measurement:
          allOf:
          - $ref: '#/components/schemas/TraceDomainMeasurementV1'
          nullable: true
        qualityReason: &id001
          type: string
          nullable: true
        sourceQuality: *id001
        eventId: *id001
        revision:
          type: integer
          nullable: true
        finalized:
          type: boolean
          nullable: true
        primitives:
          type: object
          additionalProperties: true
          nullable: true
        provenance:
          type: object
          additionalProperties: true
          nullable: true
        sourcePayloadSha256: *id001
    TraceDomainNativeSeriesV1:
      type: object
      required:
      - schemaVersion
      - mappingVersion
      - datasetId
      - sourceId
      - scopeKey
      - metricId
      - domain
      - unit
      - aggregationType
      - from
      - to
      - sourceResolutionSeconds
      - points
      - population
      - policyVersion
      - catalogueVersion
      - topologyVersion
      - sourceKind
      - synthetic
      - scope
      properties:
        schemaVersion:
          type: string
        mappingVersion:
          type: string
        datasetId:
          type: string
        sourceId:
          type: string
        scopeKey:
          type: string
        metricId:
          type: string
        domain:
          type: string
        unit:
          type: string
        aggregationType:
          type: string
        from:
          type: string
        to:
          type: string
        sourceResolutionSeconds:
          type: integer
          enum:
          - 60
          - 300
        points:
          type: array
          maxItems: 8640
          items:
            $ref: '#/components/schemas/TraceDomainNativePointV1'
        population:
          type: string
        policyVersion:
          type: string
        catalogueVersion:
          type: string
        topologyVersion:
          type: string
        sourceKind:
          type: string
        synthetic:
          type: boolean
          enum:
          - true
        scope:
          type: object
          required:
          - scopeNamespace
          - domain
          - scopeType
          - scopeId
          properties:
            scopeNamespace:
              type: string
            domain:
              type: string
            scopeType:
              type: string
            scopeId:
              type: string
            contractCityId:
              type: string
            linkId:
              type: string
            directionId:
              type: string
            partnerId:
              type: string
            countryId:
              type: string
            direction:
              type: string
            procedure:
              type: string
            accessTechnology:
              type: string
          additionalProperties: false
    GeographyMetric:
      type: object
      description: A finalized measurement; null is never silently converted to zero.
      required: [name, unit, observed, baseline, deltaPp, delayRatio, nullReason]
      properties:
        name: {type: string, enum: [TECHNICAL_CSSR, SMS_DELIVERY_P95]}
        unit: {type: string, enum: [PERCENT, MILLISECONDS]}
        observed: {type: number, nullable: true}
        baseline: {type: number, nullable: true}
        deltaPp: {type: number, nullable: true, description: VoLTE observed minus baseline in percentage points.}
        delayRatio: {type: number, nullable: true, description: SMS observed divided by positive matching baseline.}
        numerator: {type: integer, format: int64, minimum: 0, nullable: true}
        denominator: {type: integer, format: int64, minimum: 0, nullable: true}
        sampleCount: {type: integer, format: int64, minimum: 0, nullable: true}
        nullReason:
          type: string
          nullable: true
          enum: [UNKNOWN, NEVER_SEEN, MISSING, STALE, BASELINE_MISSING, INSUFFICIENT_DATA, NOT_AGGREGATABLE, UNSUPPORTED, null]
    GeographyCoverage:
      type: object
      required: [state, expectedSources, receivedSources, usableSources]
      properties:
        state: {type: string, enum: [UNKNOWN, COMPLETE, PARTIAL, MISSING, STALE]}
        expectedSources: {type: integer, minimum: 0, nullable: true}
        receivedSources: {type: integer, minimum: 0, nullable: true}
        usableSources: {type: integer, minimum: 0, nullable: true}
    GeographyServiceState:
      type: object
      required: [service, scopeId, latestWindowEnd, freshness, technicalActiveCount, analystOpenCount, coverage, metric]
      properties:
        service: {type: string, enum: [VOLTE, SMS]}
        scopeId: {type: string, maxLength: 96}
        latestWindowEnd: {type: string, format: date-time, nullable: true}
        freshness: {type: string, enum: [FRESH, STALE, MISSING, NEVER_SEEN]}
        technicalActiveCount: {type: integer, minimum: 0}
        analystOpenCount: {type: integer, minimum: 0}
        coverage: {$ref: '#/components/schemas/GeographyCoverage'}
        metric: {$ref: '#/components/schemas/GeographyMetric'}
    GeographyCitySummary:
      type: object
      required: [cityId, displayName, synthetic, catalogueVersion, topologyVersion, services]
      properties:
        cityId: {type: string, pattern: '^[A-Z]{3}$'}
        displayName: {type: string}
        synthetic: {type: boolean, enum: [true]}
        catalogueVersion: {type: string}
        topologyVersion: {type: string}
        services:
          type: array
          minItems: 2
          maxItems: 2
          items: {$ref: '#/components/schemas/GeographyServiceState'}
    GeographyCityDetail:
      allOf:
      - {$ref: '#/components/schemas/GeographyCitySummary'}
      - type: object
        required: [generatedAt, footprintNodeIds]
        properties:
          generatedAt: {type: string, format: date-time}
          footprintNodeIds:
            type: array
            items: {type: string}
    GeographyTopologyPage:
      type: object
      required: [cityId, catalogueVersion, topologyVersion, generatedAt, parentId, footprintNodeIds, dependencies, page, size, hasNext, nodes]
      properties:
        cityId: {type: string}
        catalogueVersion: {type: string}
        topologyVersion: {type: string}
        generatedAt: {type: string, format: date-time}
        parentId: {type: string}
        footprintNodeIds:
          type: array
          items: {type: string}
        dependencies:
          type: array
          items: {$ref: '#/components/schemas/GeographyDependency'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        hasNext: {type: boolean}
        nodes:
          type: array
          maxItems: 100
          items:
            type: object
            required: [nodeId, parentId, kind, measured]
            properties:
              nodeId: {type: string}
              parentId: {type: string, nullable: true}
              kind: {type: string, enum: [AGGREGATION, SITE, CELL]}
              measured: {type: boolean, description: Configured measured scope footprint membership; does not assert current measurements exist or copy a scope KPI to this node.}
    GeographyDependency:
      type: object
      required: [scopeId, service, role, nodeId, sourceId]
      properties:
        scopeId: {type: string}
        service: {type: string, enum: [VOLTE, SMS]}
        role: {type: string}
        nodeId: {type: string}
        sourceId: {type: string}
    IncidentLocation:
      type: object
      additionalProperties: false
      description: Resolved from the opening detection's captured topology and its exact source-window coverage catalogue when unique; otherwise requires a unique historical topology binding. Multiple matching coverage catalogues remain ambiguous. Today's mapping never replaces opening evidence, and legacy scopes stay unallocated.
      required: [cityId, catalogueVersion, topologyVersion, measuredScopeId, containmentPath, dependencyNodeIds, nullReason]
      properties:
        cityId: {type: string, nullable: true}
        catalogueVersion: {type: string, nullable: true}
        topologyVersion: {type: string, nullable: true}
        measuredScopeId: {type: string}
        containmentPath:
          type: array
          maxItems: 5
          items: {type: string}
        dependencyNodeIds:
          type: array
          items: {type: string}
        nullReason:
          type: string
          nullable: true
          enum: [UNALLOCATED, CAPTURED_VERSION_MISSING, BINDING_NOT_FOUND, AMBIGUOUS_CATALOGUE_VERSION, INVALID_CONTAINMENT, null]
    GeographyKpiPage:
      type: object
      required: [cityId, service, page, size, hasNext, points]
      properties:
        cityId: {type: string}
        service: {type: string, enum: [VOLTE, SMS]}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        hasNext: {type: boolean}
        points:
          type: array
          items:
            type: object
            required: [windowId, scopeId, catalogueVersion, topologyVersion, windowStart, windowEnd, coverage, metric]
            properties:
              windowId: {type: string, pattern: '^[0-9a-f]{64}$'}
              scopeId: {type: string}
              catalogueVersion: {type: string}
              topologyVersion: {type: string}
              windowStart: {type: string, format: date-time}
              windowEnd: {type: string, format: date-time}
              coverage: {$ref: '#/components/schemas/GeographyCoverage'}
              metric: {$ref: '#/components/schemas/GeographyMetric'}
    GeographyPriorityPage:
      type: object
      required: [generatedAt, policyVersion, policyStatus, page, size, hasNext, items]
      properties:
        generatedAt: {type: string, format: date-time}
        policyVersion: {type: string}
        policyStatus: {type: string, enum: [ACTIVE]}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        hasNext: {type: boolean}
        items:
          type: array
          items:
            type: object
            required: [incidentId, cityId, cityNullReason, service, scopeId, technicalState, analystStatus, severity, severityHistorical, freshness, priorityBand, comparableImpact, impactUnit, firstObservedAt, detectedAt, latestWindowEnd]
            properties:
              incidentId: {type: string, format: uuid}
              cityId: {type: string, nullable: true, description: Null for legacy or unresolved captured topology.}
              cityNullReason: {type: string, nullable: true, enum: [UNALLOCATED, CAPTURED_VERSION_MISSING, BINDING_NOT_FOUND, AMBIGUOUS_CATALOGUE_VERSION, null]}
              service: {type: string, enum: [VOLTE, SMS]}
              scopeId: {type: string}
              technicalState: {type: string, enum: [ONGOING, UNKNOWN, RECOVERED]}
              analystStatus: {type: string, enum: [OPEN, INVESTIGATING, RESOLVED]}
              severity: {type: string, enum: [MEDIUM, HIGH, CRITICAL]}
              severityHistorical: {type: boolean}
              freshness: {type: string, enum: [FRESH, STALE, UNKNOWN, RECOVERED]}
              priorityBand: {type: string, enum: [FRESH_ONGOING, UNCERTAIN, RECOVERED]}
              comparableImpact: {type: number, nullable: true, minimum: 0, description: Latest immutable detection's service-specific impact only for fresh ongoing incidents; null for missing or historical impact.}
              impactUnit: {type: string, nullable: true, enum: [EXTRA_FAILED_ATTEMPTS, AFFECTED_DELIVERED_MESSAGES, null], description: Service-specific metric identity; null outside the fresh ongoing band.}
              firstObservedAt: {type: string, format: date-time}
              detectedAt: {type: string, format: date-time}
              latestWindowEnd: {type: string, format: date-time}
    Sha256Id:
      type: string
      pattern: ^[a-f0-9]{64}$
      description: Lowercase SHA-256 hexadecimal identity derived from the canonical episode contract.
    AnalystSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - displayName
      - enabled
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        enabled:
          type: boolean
    CurrentSession:
      type: object
      additionalProperties: false
      required:
      - analystId
      - displayName
      - roles
      - expiresAt
      properties:
        analystId:
          type: string
          format: uuid
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum:
            - ANALYST
            - SUPERVISOR
            - ADMIN
          minItems: 1
          uniqueItems: true
        expiresAt:
          type: string
          format: date-time
      description: The absolute server-session deadline, not the OIDC token expiry. No cookies, tokens, issuer
        or subject are returned.
    CsrfToken:
      type: object
      additionalProperties: false
      required:
      - token
      - headerName
      - parameterName
      properties:
        token:
          type: string
          minLength: 1
        headerName:
          type: string
          enum:
          - X-CSRF-TOKEN
        parameterName:
          type: string
          enum:
          - _csrf
    ApiError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          format: uuid
        fieldErrors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
        currentVersion:
          type: integer
          minimum: 0
          format: int64
    AuditEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - incidentId
      - actorKind
      - actorId
      - action
      - occurredAt
      - requestId
      - before
      - after
      - note
      properties:
        id:
          type: string
          format: uuid
        incidentId:
          type: string
          format: uuid
        actorKind:
          type: string
          enum:
          - ANALYST
          - SYSTEM
        actorId:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
          minLength: 1
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
          format: uuid
        before:
          type: object
          nullable: true
          additionalProperties: true
        after:
          type: object
          nullable: true
          additionalProperties: true
        note:
          type: string
          nullable: true
          maxLength: 2000
      description: SYSTEM has null actorId; human actors resolve from the authenticated issuer/subject. Field
        snapshots are bounded to changed business fields, never tokens or full session data.
    AuditPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
          maxItems: 100
        total:
          type: integer
          minimum: 0
          format: int64
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
    ChangeStatusRequest:
      type: object
      additionalProperties: false
      required:
      - status
      - version
      properties:
        status:
          type: string
          enum:
          - INVESTIGATING
          - RESOLVED
        version:
          type: integer
          minimum: 0
          format: int64
        resolutionNote:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
      description: Service requires a note for RESOLVED, rejects direct OPEN -> RESOLVED, and requires assignment
        before INVESTIGATING. The acting analyst must be the assignee unless SUPERVISOR/ADMIN.
    AssignmentRequest:
      type: object
      additionalProperties: false
      required:
      - analystId
      - version
      properties:
        analystId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
          format: int64
      description: Assign to an enabled local analyst. ANALYST may only self-claim an unassigned incident;
        SUPERVISOR/ADMIN may reassign. A concurrent claim is a 409.
    CommentRequest:
      type: object
      additionalProperties: false
      required:
      - text
      - version
      - requestId
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        version:
          type: integer
          minimum: 0
          format: int64
        requestId:
          type: string
          format: uuid
      description: requestId is correlation metadata, never actor identity. If X-Request-ID is also present,
        it must match this value.
    ServiceDetection:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          enum:
          - 2
        detectionId:
          $ref: '#/components/schemas/Sha256Id'
        episodeId:
          $ref: '#/components/schemas/Sha256Id'
        correlationKey:
          $ref: '#/components/schemas/Sha256Id'
        sequence:
          type: integer
          minimum: 1
        phase:
          type: string
          enum:
          - OPEN
          - UPDATE
          - RECOVERY
          - UNKNOWN
        anomalyType:
          type: string
          enum:
          - VOLTE_SETUP_DEGRADATION
          - SMS_DELIVERY_DELAY
        scopeId:
          type: string
          pattern: ^[A-Za-z0-9_.:-]{1,96}$
        service:
          type: string
          enum:
          - VOLTE
          - SMS
        firstObservedAt:
          type: string
          format: date-time
          pattern: Z$
          description: Episode anchor and first eligible breached window start used to derive episodeId.
        windowStart:
          type: string
          format: date-time
          pattern: Z$
        windowEnd:
          type: string
          format: date-time
          pattern: Z$
        detectedAt:
          type: string
          format: date-time
          pattern: Z$
        severity:
          type: string
          enum:
          - MEDIUM
          - HIGH
          - CRITICAL
        technicalState:
          type: string
          enum:
          - ONGOING
          - RECOVERED
          - UNKNOWN
        rulesetVersion:
          type: string
          minLength: 1
          maxLength: 160
        baselineVersion:
          type: string
          minLength: 1
          maxLength: 160
        topologyVersion:
          type: string
          minLength: 1
          maxLength: 160
        kpis:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 160
              observed:
                type: number
                nullable: true
              baseline:
                type: number
                nullable: true
              unit:
                type: string
                enum:
                - PERCENT
                - PERCENTAGE_POINTS
                - RATIO
                - COUNT
                - MILLISECONDS
                - SECONDS
                - MBPS
              numerator:
                type: number
                nullable: true
              denominator:
                type: number
                nullable: true
            required:
            - name
            - observed
            - baseline
            - unit
            - numerator
            - denominator
          maxItems: 30
        impact:
          type: object
          additionalProperties: false
          properties:
            extraFailedAttempts:
              type: number
              minimum: 0
            affectedDeliveredMessages:
              type: integer
              minimum: 0
            pendingMessages:
              type: integer
              minimum: 0
            uniqueSubscribers:
              type: string
              nullable: true
              enum:
              - null
              description: Always null in this aggregate demo; observations do not identify unique subscribers.
          required:
          - extraFailedAttempts
          - affectedDeliveredMessages
          - pendingMessages
          - uniqueSubscribers
        probableCause:
          type: string
          maxLength: 1000
        causeConfidence:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
        evidence:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              code:
                type: string
                minLength: 1
                maxLength: 160
              summary:
                type: string
                maxLength: 1000
              nodeId:
                type: string
                nullable: true
              sourceEventIds:
