server {
    listen 8080;
    server_name telecom.test localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $keycloak http://keycloak:8080;
    set $backend http://host.docker.internal:8082;

    # Reject unsupported or dangerous HTTP methods
    if ($request_method ~ ^(TRACE|TRACK)$ ) {
        return 405;
    }

    # Security headers for browser boundary hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://telecom.test:8080 ws://telecom.test:8080; img-src 'self' data:; font-src 'self'; frame-ancestors 'self';" always;

    # Sanitized forwarded headers - strip client-supplied spoofing
    proxy_set_header Host telecom.test:8080;
    proxy_set_header X-Forwarded-Host telecom.test:8080;
    proxy_set_header X-Forwarded-Port 8080;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_redirect off;
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;

    # Deny access to hidden/dot files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Canonical Keycloak auth routing
    location = /auth {
        return 308 /auth/;
    }

    location ^~ /auth/ {
        proxy_pass $keycloak;
        proxy_set_header Host telecom.test:8080;
        proxy_set_header X-Forwarded-Host telecom.test:8080;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # SPA login handoff page - avoid caching
    location = /login {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # Protected security and API endpoints routing to backend
    location ~ ^/(api|oauth2|login|logout|actuator)(/|$) {
        proxy_pass $backend;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host telecom.test:8080;
        proxy_set_header X-Forwarded-Host telecom.test:8080;
        proxy_set_header X-Forwarded-Port 8080;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Cache control for the application shell
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Client-side SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
