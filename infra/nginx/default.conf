server {
    listen 8080;
    server_name telecom.test;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $keycloak http://keycloak:8080;
    set $backend http://host.docker.internal:8082;

    proxy_set_header Host telecom.test:8080;
    proxy_set_header X-Forwarded-Host telecom.test:8080;
    proxy_set_header X-Forwarded-Port 8080;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;

    location = /auth {
        return 308 /auth/;
    }

    location ^~ /auth/ {
        proxy_pass $keycloak;
    }

    # The guard and direct visits share Angular's handoff page. Only the button
    # starts OIDC; the more specific callback remains a backend route below.
    location = /login {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Security and API requests always reach Spring, never the SPA fallback.
    location ~ ^/(api|oauth2|login|logout|actuator)(/|$) {
        proxy_pass $backend;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Avoid serving a cached app shell after deploying a new frontend build.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Angular handles /dashboard, /signed-out, and other client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
