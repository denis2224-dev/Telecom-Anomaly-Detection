server {
    listen 8080;
    server_name telecom.test;

    # Re-resolve service names after Compose recreates a container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $keycloak http://keycloak:8080;
    set $backend http://host.docker.internal:8082;

    proxy_set_header Host telecom.test:8080;
    proxy_set_header X-Forwarded-Host telecom.test:8080;
    proxy_set_header X-Forwarded-Port 8080;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_buffer_size 16k;
    proxy_buffers 4 16k;

    location /auth/ {
        proxy_pass $keycloak;
    }

    # The incident service runs on the host during local development.
    location / {
        proxy_pass $backend;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
