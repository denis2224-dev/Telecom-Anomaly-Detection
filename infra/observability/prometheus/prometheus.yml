global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: event-generator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["event-generator:8081"]
  - job_name: processor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["processor:8083"]
  - job_name: incident-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["incident-service:8082"]
