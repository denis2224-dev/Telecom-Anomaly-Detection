groups:
  - name: trace-link-runtime
    rules:
      - alert: TraceLinkSourceStale
        expr: telecom_processor_sources{state="stale"} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A configured source is stale"
          description: "Investigate source freshness and upstream publication before restarting services."
          rationale: "Observations must arrive within the 600-second freshness window to avoid undetected impairments."
          owner_action: "Inspect event-generator heartbeat and upstream Kafka topic lag for telecom.observations.v2."
          recovery_verification: "Verify source state transitions to 'active' and lag returns to zero."

      - alert: TraceLinkFinalizerLag
        expr: histogram_quantile(0.95, sum by (le) (rate(telecom_processor_finalizer_delay_seconds_bucket[5m]))) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Window finalization latency is elevated"
          description: "Check database latency, Kafka lag, and finalizer scheduling."
          rationale: "Excessive delay in 5-minute window finalization delays incident detection and reporting."
          owner_action: "Check processing_db connection pool saturation, thread pool health, and Kafka partition assignments."
          recovery_verification: "Ensure finalizer p95 latency drops below 60s for two consecutive 5m evaluation intervals."

      - alert: TraceLinkOutboxAge
        expr: max(telecom_processor_outbox_oldest_age_seconds) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "An outbox queue is older than five minutes"
          description: "Check publisher health and database connectivity; preserve rows for replay."
          rationale: "Outbox rows must publish to Kafka atomically within 5 minutes to prevent backlog accumulation."
          owner_action: "Verify publisher worker threads and Kafka broker cluster availability."
          recovery_verification: "Confirm oldest outbox age falls below 60s and queue drains to zero."

      - alert: TraceLinkDetectorBacklog
        expr: max(telecom_processor_detector_job_age_seconds) > 120 or telecom_processor_detector_backlog_total > 500
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Detector job backlog is elevated"
          description: "Detector workers are processing jobs slower than the window arrival rate."
          rationale: "Backlog exceeding 500 jobs indicates queue accumulation and impending lease expirations."
          owner_action: "Scale worker concurrency via TRACE_LINK_WORKERS or inspect CPU/memory throttling."
          recovery_verification: "Ensure detector job age drops below 30s and backlog returns to baseline."

      - alert: TraceLinkMlFallbackRate
        expr: sum(rate(telecom_ml_inference_fallback_total[5m])) / clamp_min(sum(rate(telecom_ml_inference_requests_total[5m])), 1) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ML fallback rate is elevated"
          description: "Deterministic detection remains authoritative; inspect model readiness and latency."
          rationale: "Fallback exceeding 25% suggests inference server timeouts, model crash, or concurrency exhaustion."
          owner_action: "Inspect ml-service container health, HTTP 503 limits, and Uvicorn concurrency logs."
          recovery_verification: "Verify ML readiness returns to UP and fallback rate drops below 5%."

      - alert: TraceLinkApiErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API error rate is elevated"
          description: "Check route health, database pools, and dependency availability."
          rationale: "REST API error rate above 5% impairs analyst dashboards and automated integrations."
          owner_action: "Inspect incident-service error logs, database query timeouts, and proxy routing."
          recovery_verification: "Ensure 5xx HTTP response rate drops below 1% for 5 minutes."

      - alert: TraceLinkSseSaturation
        expr: sum(telecom_incident_sse_active_connections) > 500 or telecom_incident_sse_dropped_events_total > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "SSE connection capacity or dropped events threshold exceeded"
          description: "Server-Sent Events connection pool is near saturation or events have dropped."
          rationale: "Dropped SSE events force clients to fall back to expensive REST polling."
          owner_action: "Check proxy connection limits, memory utilization, and client reconnect frequency."
          recovery_verification: "Verify dropped event counter remains static and active connections normalize."

      - alert: TraceLinkPendingDeliveryFailure
        expr: sum(rate(telecom_incident_delivery_permanent_failures_total[5m])) > 0 or max(telecom_incident_delivery_pending_oldest_age_seconds) > 300
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Incident notification delivery failure or excessive pending age"
          description: "Notification worker cannot deliver alerts to configured destinations."
          rationale: "Pending deliveries older than 5 minutes indicate notification worker or endpoint stalls."
          owner_action: "Check delivery retry queues and external push gateway connectivity."
          recovery_verification: "Verify permanent failure rate returns to 0 and pending queue drains."

      - alert: TraceLinkDatasourceUnavailable
        expr: absent(up{job="processor"}) or absent(up{job="incident-service"})
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "A monitored application is unavailable"
          description: "Treat platform availability separately from telecom-service impairment."
          rationale: "Target scrape failure prevents observability and capacity accounting."
          owner_action: "Restart failed container processes and inspect Docker/container logs."
          recovery_verification: "Confirm up metric equals 1 for both processor and incident-service."

      - alert: TraceLinkDatabasePoolExhaustion
        expr: (telecom_db_pool_active / clamp_min(telecom_db_pool_max, 1) > 0.9) or (telecom_db_pool_wait_count > 10)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool near exhaustion"
          description: "Application threads are waiting for available PostgreSQL database connections."
          rationale: "Exhausted connection pools cause transaction timeouts and HTTP 500 spikes."
          owner_action: "Inspect long-running queries, transaction locks, and pool sizing in application.yaml."
          recovery_verification: "Confirm pool utilization drops below 70% and wait count drops to zero."

      - alert: TraceLinkGrafanaDatasourceFailure
        expr: rate(grafana_datasource_query_errors_total{datasource="trace-link-pg"}[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Grafana read-only PostgreSQL datasource query errors elevated"
          description: "Queries to incidents_db via trace_link_reader are failing."
          rationale: "Grafana dashboard failures prevent visual monitoring without impacting pipeline processing."
          owner_action: "Verify trace_link_reader credentials, reporting schema views, and PostgreSQL connection limit."
          recovery_verification: "Confirm Grafana panel queries return 200 without SQL execution errors."
