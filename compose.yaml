name: telecom-anomaly

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      # The image bootstrap database remains the legacy database until Day 02
      # provisions the three target databases without replacing this volume.
      POSTGRES_DB: ${POSTGRES_DB:-telecom}
      POSTGRES_USER: ${POSTGRES_USER:-telecom_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telecom_admin_password}

      # Day 01 target reservation.  These names are consumed by the Day 02
      # non-destructive provisioning script; the existing init script is not
      # an upgrade mechanism for an already-initialised volume.
      PROCESSING_DB_NAME: ${PROCESSING_DB_NAME:-processing_db}
      INCIDENTS_DB_NAME: ${INCIDENTS_DB_NAME:-incidents_db}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak_db}
      PROCESSING_DB_USER: ${PROCESSING_DB_USER:-processing_app}
      PROCESSING_DB_PASSWORD: ${PROCESSING_DB_PASSWORD:-processing_app_password}
      PROCESSING_MIGRATOR_USER: ${PROCESSING_MIGRATOR_USER:-processing_migrator}
      PROCESSING_MIGRATOR_PASSWORD: ${PROCESSING_MIGRATOR_PASSWORD:-processing_migrator_password}
      INCIDENT_DB_USER: ${INCIDENT_DB_USER:-incident_app}
      INCIDENT_DB_PASSWORD: ${INCIDENT_DB_PASSWORD:-incident_app_password}
      INCIDENT_MIGRATOR_USER: ${INCIDENT_MIGRATOR_USER:-incident_migrator}
      INCIDENT_MIGRATOR_PASSWORD: ${INCIDENT_MIGRATOR_PASSWORD:-incident_migrator_password}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak_app}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_app_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - telecom-private

  kafka:
    # Bitnami moved historical versioned images to its legacy namespace.
    # Keep this compatible, pinned 3.7.1 image until a separately tested upgrade.
    image: bitnamilegacy/kafka:3.7.1-debian-12-r4
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9094}:9094"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks:
      - telecom-private

  kafka-init:
    image: bitnamilegacy/kafka:3.7.1-debian-12-r4
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        kafka_topics=/opt/bitnami/kafka/bin/kafka-topics.sh
        common=(--bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1 --partitions ${KAFKA_TOPIC_PARTITIONS:-3})

        # Revision 1/2 topics remain separate until their retirement is reviewed.
        "$${kafka_topics}" "$${common[@]}" --topic telecom.events.v1 --config retention.ms=86400000
        "$${kafka_topics}" "$${common[@]}" --topic telecom.detections.v1 --config retention.ms=604800000
        "$${kafka_topics}" "$${common[@]}" --topic telecom.telemetry.v1 --config retention.ms=604800000
        "$${kafka_topics}" "$${common[@]}" --topic telecom.events.dlq.v1 --config retention.ms=604800000
        "$${kafka_topics}" "$${common[@]}" --topic telecom.events.late.v1 --config retention.ms=604800000
        "$${kafka_topics}" "$${common[@]}" --topic telecom.detections.dlq.v1 --config retention.ms=604800000

        # Revision 3 service-assurance topics.  V2 observation input has a
        # 24-hour raw retention; derived, invalid and late records have a
        # seven-day retention for the local demo.
        "$${kafka_topics}" "$${common[@]}" --topic ${KAFKA_V2_OBSERVATIONS_TOPIC:-telecom.observations.v2} --config retention.ms=${KAFKA_RAW_RETENTION_MS:-86400000}
        "$${kafka_topics}" "$${common[@]}" --topic ${KAFKA_V2_KPIS_TOPIC:-telecom.kpis.v2} --config retention.ms=${KAFKA_DERIVED_RETENTION_MS:-604800000}
        "$${kafka_topics}" "$${common[@]}" --topic ${KAFKA_V2_DETECTIONS_TOPIC:-telecom.detections.v2} --config retention.ms=${KAFKA_DERIVED_RETENTION_MS:-604800000}
        "$${kafka_topics}" "$${common[@]}" --topic ${KAFKA_V2_INVALID_TOPIC:-telecom.observations.invalid.v2} --config retention.ms=${KAFKA_DERIVED_RETENTION_MS:-604800000}
        "$${kafka_topics}" "$${common[@]}" --topic ${KAFKA_V2_LATE_TOPIC:-telecom.observations.late.v2} --config retention.ms=${KAFKA_DERIVED_RETENTION_MS:-604800000}
    networks:
      - telecom-private
    restart: "no"

  event-generator:
    build:
      context: .
      dockerfile: services/event-generator/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SERVER_PORT: 8081
      KAFKA_READINESS_TIMEOUT: ${KAFKA_READINESS_TIMEOUT:-2s}
      KAFKA_READINESS_POLL_INTERVAL: ${KAFKA_READINESS_POLL_INTERVAL:-1s}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - telecom-private

  processor:
    build:
      context: .
      dockerfile: services/processor/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SERVER_PORT: 8083
      KAFKA_READINESS_TIMEOUT: ${KAFKA_READINESS_TIMEOUT:-2s}
      KAFKA_READINESS_POLL_INTERVAL: ${KAFKA_READINESS_POLL_INTERVAL:-1s}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    expose:
      - "8083"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8083/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - telecom-private

  ml-service:
    build:
      context: .
      dockerfile: services/ml-service/Dockerfile
    environment:
      ML_MANIFEST_PATH: /app/model-manifest.json
      ML_PORT: 8000
      FEATURE_VERSION: ${FEATURE_VERSION:-1}
      ML_CONCURRENCY: ${ML_CONCURRENCY:-1}
    volumes:
      - ./services/ml-service/models:/models:ro
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen('http://localhost:8000/health/readiness', timeout=2);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "${ML_CPU_LIMIT:-1.0}"
          memory: "${ML_MEMORY_LIMIT:-512M}"
    networks:
      - telecom-private

networks:
  telecom-private:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
