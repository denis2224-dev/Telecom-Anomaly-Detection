name: telecom-anomaly

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telecom}
      POSTGRES_USER: ${POSTGRES_USER:-telecom_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telecom_admin_password}
      PROCESSING_DB_USER: ${PROCESSING_DB_USER:-processing_app}
      PROCESSING_DB_PASSWORD: ${PROCESSING_DB_PASSWORD:-processing_app_password}
      INCIDENT_DB_USER: ${INCIDENT_DB_USER:-incident_app}
      INCIDENT_DB_PASSWORD: ${INCIDENT_DB_PASSWORD:-incident_app_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - telecom-private

  kafka:
    image: bitnami/kafka:3.7.1
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9094}:9094"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks:
      - telecom-private

  kafka-init:
    image: bitnami/kafka:3.7.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        kafka_topics=/opt/bitnami/kafka/bin/kafka-topics.sh
        common=(--bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1 --partitions ${KAFKA_TOPIC_PARTITIONS:-3})
        "$${kafka_topics}" "$${common[@]}" --topic telecom.events.v1 --config retention.ms=86400000
        "$${kafka_topics}" "$${common[@]}" --topic telecom.detections.v1 --config retention.ms=604800000
        "$${kafka_topics}" "$${common[@]}" --topic telecom.telemetry.v1 --config retention.ms=604800000
        "$${kafka_topics}" "$${common[@]}" --topic telecom.events.dlq.v1 --config retention.ms=604800000
        "$${kafka_topics}" "$${common[@]}" --topic telecom.events.late.v1 --config retention.ms=604800000
        "$${kafka_topics}" "$${common[@]}" --topic telecom.detections.dlq.v1 --config retention.ms=604800000
    networks:
      - telecom-private
    restart: "no"

networks:
  telecom-private:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
